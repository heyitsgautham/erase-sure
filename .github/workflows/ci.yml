name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Destructive wipes need SECUREWIPE_DANGER=1 plus --danger-allow-wipe.
  # CI sets neither, and every wipe test runs against temp files through a fake command runner.
  SECUREWIPE_DANGER: "0"

jobs:
  core:
    name: Core (Rust CLI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run tests as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "Tests must not run as root: a wipe bug could then reach a real block device." >&2
            exit 1
          fi

      # Pinned so a new stable release cannot add clippy lints and turn CI red overnight.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements-lock.txt

      - name: Install Python packages for the PDF generator
        run: pip install --require-hashes -r ../portal/requirements-lock.txt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo llvm-cov --all-targets --locked --summary-only --fail-under-lines 70

      - name: Dependency audit
        run: cargo audit

  portal:
    name: Portal (FastAPI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements-lock.txt

      - name: Install
        run: pip install --require-hashes -r requirements-lock.txt

      - name: Lint
        run: |
          pipx run ruff==0.14.0 check .
          pipx run ruff==0.14.0 format --check .

      - name: Test
        run: python -m pytest --cov --cov-report=term-missing

      - name: Dependency audit
        run: pipx run pip-audit==2.10.1 --require-hashes -r requirements-lock.txt

  ui:
    name: UI (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  tauri:
    name: Desktop backend (Tauri)
    # Tauri 1 links against webkit2gtk-4.0, which Ubuntu 24.04 no longer ships.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK and GTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Build the frontend that Tauri embeds
        working-directory: ui
        run: npm ci && npm run build

      - name: Format
        working-directory: ui/src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: ui/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: ui/src-tauri
        run: cargo test --locked

      - name: Dependency audit
        working-directory: ui/src-tauri
        run: cargo audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images and compose smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose --profile cli build

      - name: Start the portal
        run: docker compose up -d --wait portal

      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/health

      - name: CLI runs in its image
        run: |
          docker compose run --rm cli --version
          docker compose run --rm cli cert validate --file /data/latest_cert.json

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
