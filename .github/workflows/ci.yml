name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Destructive wipes need SECUREWIPE_DANGER=1 plus --danger-allow-wipe.
  # CI sets neither, and every wipe test runs against temp files through a fake command runner.
  SECUREWIPE_DANGER: "0"

jobs:
  core:
    name: Core (Rust CLI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to run tests as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "Tests must not run as root: a wipe bug could then reach a real block device." >&2
            exit 1
          fi

      # Pinned so a new stable release cannot add clippy lints and turn CI red overnight.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements-lock.txt

      - name: Install Python packages for the PDF generator
        run: pip install --require-hashes -r ../portal/requirements-lock.txt

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test with coverage
        run: cargo llvm-cov --all-targets --locked --summary-only

      - name: Dependency audit
        run: cargo audit

  portal:
    name: Portal (FastAPI)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: portal/requirements-lock.txt

      - name: Install
        run: pip install --require-hashes -r requirements-lock.txt

      - name: Lint
        run: |
          pipx run ruff==0.14.0 check .
          pipx run ruff==0.14.0 format --check .

      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Dependency audit
        run: pipx run pip-audit==2.10.1 --require-hashes -r requirements-lock.txt

  ui:
    name: UI (React + Vite)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
