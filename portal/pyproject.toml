# Tool configuration for the verification portal.
# Runtime dependencies live in requirements.txt and requirements-lock.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501", # the formatter owns line length
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["app", "keygen"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
